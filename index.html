<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adeeb Sultan — Mobile Application Engineer building Flutter and Native Android apps with Clean Architecture." />
    <meta name="theme-color" content="#0b0b12" />
    <title>أديب سلطان | مهندس تطبيقات موبايل — Flutter &amp; Native Android</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
:root {
  --bg: #0b0b12;
  --bg-2: #11111b;
  --card: #14141f;
  --card-2: #191927;
  --line: rgba(255, 255, 255, 0.08);
  --text: #ffffff;
  --muted: #a3a3b8;
  --accent: #5b52e0;
  --accent-2: #7b73ff;
  --accent-soft: rgba(91, 82, 224, 0.16);
  --radius: 20px;
  --font-head: 'Familjen Grotesk', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  /* Horizontal direction multiplier used by slide animations (-1 in RTL). */
  --dir: 1;
}

:root[dir='rtl'] {
  --dir: -1;
  --font-head: 'Cairo', 'Familjen Grotesk', system-ui, sans-serif;
  --font-body: 'Cairo', 'Inter', system-ui, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 84px;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img {
  display: block;
  max-width: 100%;
}

a {
  color: inherit;
  text-decoration: none;
}

ul {
  list-style: none;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}

h1,
h2,
h3 {
  font-family: var(--font-head);
  line-height: 1.1;
  letter-spacing: -0.02em;
}

:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: 3px;
  border-radius: 6px;
}

.container {
  width: min(1140px, 100% - 32px);
  margin-inline: auto;
}

/* ---------- Reveal ---------- */
/* Entrance uses the individual `translate`/`scale` properties so it composes
   with `transform` (used by hover tilt and keyframe animations). */
.reveal {
  --reveal-t: opacity 0.8s ease var(--d, 0ms),
    translate 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) var(--d, 0ms),
    scale 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) var(--d, 0ms), transform 0.25s ease-out;
  opacity: 0;
  translate: 0 32px;
  transition: var(--reveal-t);
}
.reveal--left {
  translate: calc(var(--dir) * -48px) 0;
}
.reveal--right {
  translate: calc(var(--dir) * 48px) 0;
}
.reveal--zoom {
  translate: 0 20px;
  scale: 0.86;
}
.reveal.is-in {
  opacity: 1;
  translate: 0 0;
  scale: 1;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.92rem;
  transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.btn:hover {
  transform: translateY(-2px);
}
.btn--primary {
  background: var(--accent);
  box-shadow: 0 10px 30px -10px rgba(91, 82, 224, 0.8);
}
.btn--primary:hover {
  background: var(--accent-2);
}
.btn--ghost {
  border: 1px solid var(--line);
  color: var(--text);
}
.btn--ghost:hover {
  border-color: var(--accent-2);
  background: var(--accent-soft);
}
.btn--outline {
  border: 1px solid rgba(255, 255, 255, 0.35);
  padding: 9px 18px;
}
.btn--outline:hover {
  border-color: var(--accent-2);
  background: var(--accent-soft);
}

/* ---------- Navbar ---------- */
.nav {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 100;
  transition: background 0.3s, border-color 0.3s, backdrop-filter 0.3s;
  border-bottom: 1px solid transparent;
}
.nav--scrolled,
.nav--open {
  background: rgba(11, 11, 18, 0.82);
  backdrop-filter: blur(14px);
  border-bottom-color: var(--line);
}
.nav__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 1.25rem;
}
.logo__mark {
  display: grid;
}
.nav__links {
  display: flex;
  align-items: center;
  gap: 34px;
}
.nav__links > a:not(.btn) {
  font-size: 0.85rem;
  color: var(--muted);
  transition: color 0.2s;
}
.nav__links > a:not(.btn):hover,
.nav__links > a.is-active {
  color: var(--accent-2);
}
.nav__toggle {
  display: none;
}

/* ---------- Hero ---------- */
.hero {
  position: relative;
  padding: 150px 0 110px;
  overflow: hidden;
  background:
    radial-gradient(60% 55% at 78% 30%, rgba(91, 82, 224, 0.28), transparent 70%),
    radial-gradient(45% 45% at 15% 85%, rgba(140, 90, 60, 0.16), transparent 70%),
    linear-gradient(180deg, #0c0c14 0%, #0b0b12 100%);
}
.hero__grid {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 48px;
  align-items: center;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 0.82rem;
  color: var(--muted);
  padding: 7px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.03);
  margin-bottom: 26px;
}
.eyebrow__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.18);
}
.hero__title {
  font-size: clamp(2.7rem, 6.2vw, 4.6rem);
  font-weight: 700;
  margin-bottom: 26px;
}
.hero__title-box {
  position: relative;
  display: inline-block;
  padding: 2px 10px;
  margin-inline-start: -10px;
  border: 1.5px solid var(--accent-2);
  background: rgba(91, 82, 224, 0.1);
}
.hero__title-box::before,
.hero__title-box::after {
  content: '';
  position: absolute;
  width: 8px;
  height: 8px;
  background: #fff;
  border: 1.5px solid var(--accent-2);
}
.hero__title-box::before {
  top: -5px;
  left: -5px;
}
.hero__title-box::after {
  bottom: -5px;
  right: -5px;
}
.hero__lead {
  max-width: 520px;
  color: var(--muted);
  font-size: 0.98rem;
  margin-bottom: 32px;
}
.hero__lead strong {
  color: var(--text);
  font-weight: 600;
}
.hero__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 46px;
}
.hero__stats {
  display: flex;
  gap: 38px;
  flex-wrap: wrap;
}
.hero__stats div {
  display: flex;
  flex-direction: column;
  max-width: 130px;
}
.hero__stats strong {
  font-family: var(--font-head);
  font-size: 2rem;
  line-height: 1.1;
}
.hero__stats .stat > span {
  color: var(--muted);
  font-size: 0.78rem;
}

.hero__visual {
  position: relative;
  aspect-ratio: 1 / 1.05;
  width: min(100%, 460px);
  justify-self: center;
}
.hero__frame-fill,
.hero__frame-outline,
.hero__photo {
  position: absolute;
  border-radius: 34px;
}
.hero__frame-outline {
  inset: 2% 4% 8% 2%;
  border: 1.5px solid rgba(255, 255, 255, 0.4);
  transform: rotate(-9deg);
}
.hero__frame-fill {
  inset: 10% 8% 4% 6%;
  background: linear-gradient(135deg, #6a61f0, #4a41c8);
  transform: rotate(9deg);
  box-shadow: 0 30px 80px -20px rgba(91, 82, 224, 0.7);
}
.hero__photo {
  inset: 7% 12% 9% 10%;
  overflow: hidden;
  transform: rotate(-4deg);
  border: 3px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 25px 60px -20px rgba(0, 0, 0, 0.7);
  animation: float 6s ease-in-out infinite;
}
.hero__photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 30%;
  transform: scale(1.12);
}
@keyframes float {
  50% {
    transform: rotate(-4deg) translateY(-10px);
  }
}
.deco {
  position: absolute;
  color: #fff;
}
.deco--squiggle {
  top: 2%;
  left: 2%;
}
.deco--circle {
  top: 4%;
  right: 6%;
  width: 26px;
  height: 26px;
  border: 1.5px solid #fff;
  border-radius: 50%;
}
.deco--plus {
  bottom: 22%;
  right: -2%;
  font-size: 2rem;
  font-weight: 300;
  line-height: 1;
}
.deco--play {
  bottom: 6%;
  left: -2%;
  color: var(--accent-2);
}
.hero__badge {
  position: absolute;
  bottom: 3%;
  right: 4%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  font-size: 0.78rem;
  font-weight: 500;
  background: rgba(20, 20, 31, 0.85);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.hero__badge-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-2);
}

/* ---------- Sections ---------- */
.section {
  padding: 90px 0;
}
.section__title {
  font-size: clamp(2rem, 4.2vw, 2.9rem);
  font-weight: 700;
}
.section__sub {
  color: var(--muted);
  margin-top: 12px;
  max-width: 520px;
}

/* ---------- Why ---------- */
.why {
  background: linear-gradient(180deg, #0b0b12, #0d0d16 60%, #0b0b12);
}
.why__head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 32px;
  margin-bottom: 44px;
}
.why__intro {
  max-width: 360px;
  color: var(--muted);
  font-size: 0.88rem;
}
/* Bento layout: showcase on the left spanning two rows, four strengths on the right. */
.why__grid {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  grid-auto-rows: minmax(250px, auto);
  gap: 18px;
}

/* ---------- Cards ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px;
  transition: border-color 0.25s, transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1), opacity 0.7s;
}
.card:hover {
  border-color: rgba(123, 115, 255, 0.5);
}
.why__item {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 28px;
  overflow: hidden;
}
.why__item h3 {
  font-size: 1.2rem;
  margin: auto 0 8px;
  padding-top: 18px;
}
.why__item p {
  color: var(--muted);
  font-size: 0.86rem;
}
.why__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.why__num {
  font-family: var(--font-head);
  font-size: 2.6rem;
  font-weight: 700;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255, 255, 255, 0.16);
}
.why__icon {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 14px;
  font-size: 1.25rem;
  background: var(--accent-soft);
  color: var(--accent-2);
}

/* ---------- Skills ---------- */
.skills__tech {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 14px;
  margin: 40px 0 22px;
}
.tech {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 22px 10px;
  text-align: center;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--muted);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
}
.tech__icon {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  border-radius: 16px;
  font-size: 1.6rem;
  color: #fff;
  background: linear-gradient(135deg, #6a61f0, #4a41c8);
  transition: rotate 0.35s, scale 0.35s, box-shadow 0.35s;
  animation: bob 3.4s ease-in-out infinite;
  animation-delay: calc(var(--i, 0) * -0.55s);
}
.tech:hover .tech__icon {
  rotate: -8deg;
  scale: 1.12;
  box-shadow: 0 14px 30px -8px rgba(91, 82, 224, 0.9);
}
.skills__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.card__title {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 1.2rem;
  margin-bottom: 16px;
}
.card__title--gap {
  margin-top: 26px;
}
.pill {
  font-family: var(--font-body);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0;
  padding: 4px 10px;
  border-radius: 999px;
  color: var(--accent-2);
  background: var(--accent-soft);
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.chips li {
  padding: 8px 14px;
  font-size: 0.82rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card-2);
}
.list li {
  position: relative;
  padding: 10px 0;
  padding-inline-start: 24px;
  font-size: 0.92rem;
  border-bottom: 1px solid var(--line);
}
.list li:last-child {
  border-bottom: 0;
}
.list li::before {
  content: '';
  position: absolute;
  inset-inline-start: 0;
  top: 50%;
  translate: 0 -50%;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--accent-2);
  rotate: 45deg;
}
.edu {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  color: var(--muted);
  font-size: 0.9rem;
}
.edu svg {
  flex: none;
  margin-top: 4px;
  color: var(--accent-2);
}
.langs li {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 0.9rem;
}
.langs span {
  color: var(--muted);
}
.interests {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 22px;
  padding: 20px 26px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(91, 82, 224, 0.2), rgba(91, 82, 224, 0.05));
  border: 1px solid rgba(123, 115, 255, 0.25);
}
.interests span {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 1.1rem;
  margin-inline-end: 8px;
}
.interests b {
  font-weight: 500;
  font-size: 0.85rem;
  color: var(--muted);
}
.interests b:not(:last-child)::after {
  content: '|';
  margin-inline-start: 12px;
  color: var(--line);
}

/* ---------- Projects ---------- */
.projects {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  margin-top: 40px;
}
.project {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  transition: border-color 0.25s, box-shadow 0.25s, opacity 0.7s, transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.project:hover {
  border-color: rgba(123, 115, 255, 0.5);
  box-shadow: 0 30px 60px -30px rgba(91, 82, 224, 0.6);
}
.project__media {
  display: block;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background: #0d0d16;
}
.project__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}
.project:hover .project__media img {
  transform: scale(1.05);
}
.project__body {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding: 24px 26px 26px;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.tags span {
  padding: 4px 11px;
  font-size: 0.72rem;
  font-weight: 600;
  border-radius: 999px;
  color: var(--accent-2);
  background: var(--accent-soft);
}
.project h3 {
  font-size: 1.45rem;
  margin-bottom: 10px;
}
.project p {
  color: var(--muted);
  font-size: 0.9rem;
  margin-bottom: 20px;
}
.project__link {
  margin-top: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  width: fit-content;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--accent-2);
}
.project__link:hover {
  gap: 10px;
  color: #fff;
}
.project__link {
  transition: gap 0.2s, color 0.2s;
}

/* ---------- Contact ---------- */
.cta {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 40px;
  align-items: center;
  padding: 56px;
  border-radius: 32px;
  border: 1px solid rgba(123, 115, 255, 0.3);
  background:
    radial-gradient(60% 90% at 100% 0%, rgba(91, 82, 224, 0.45), transparent 70%),
    var(--card);
}
.cta__text p {
  color: var(--muted);
  margin: 16px 0 28px;
  max-width: 420px;
}
.cta__links {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.contact-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  font-size: 0.92rem;
  word-break: break-all;
  background: rgba(11, 11, 18, 0.55);
  border: 1px solid var(--line);
  border-radius: 14px;
  transition: border-color 0.2s, transform 0.2s;
}
.contact-item:hover {
  border-color: var(--accent-2);
  transform: translateX(calc(var(--dir) * 4px));
}
.contact-item span {
  flex: none;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--accent);
}

/* ---------- Footer ---------- */
.footer {
  border-top: 1px solid var(--line);
  padding: 28px 0;
  color: var(--muted);
  font-size: 0.85rem;
}
.footer__inner {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.footer a:hover {
  color: var(--accent-2);
}

/* ---------- Responsive ---------- */
@media (max-width: 960px) {
  .hero {
    padding-top: 120px;
  }
  .hero__grid {
    grid-template-columns: 1fr;
  }
  .hero__visual {
    width: min(100%, 400px);
  }
  .why__head {
    flex-direction: column;
    align-items: flex-start;
  }
  .why__grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .showcase {
    grid-column: 1 / -1;
    grid-row: auto;
    min-height: 460px;
  }
  .skills__tech {
    grid-template-columns: repeat(3, 1fr);
  }
  .skills__grid {
    grid-template-columns: 1fr;
  }
  .cta {
    grid-template-columns: 1fr;
    padding: 36px 26px;
  }
}

@media (max-width: 820px) {
  .nav__toggle {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
  }
  .nav__links {
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 8px 16px 20px;
    background: #0b0b12;
    border-bottom: 1px solid var(--line);
    display: none;
  }
  .nav--open .nav__links {
    display: flex;
  }
  .nav__links > a:not(.btn) {
    padding: 14px 4px;
    font-size: 1rem;
    border-bottom: 1px solid var(--line);
  }
  .nav__cta {
    margin-top: 16px;
    justify-content: center;
  }
}

@media (max-width: 640px) {
  .section {
    padding: 64px 0;
  }
  .projects {
    grid-template-columns: 1fr;
  }
  .why__grid {
    grid-template-columns: 1fr;
    grid-auto-rows: auto;
  }
  .showcase {
    min-height: 420px;
  }
  .skills__tech {
    grid-template-columns: repeat(2, 1fr);
  }
  .hero__stats {
    gap: 24px;
  }
  .interests b::after {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  .reveal {
    opacity: 1;
    transform: none;
    transition: none;
  }
  .hero__photo {
    animation: none;
  }
}

/* ---------- Light Theme Support ---------- */
:root[data-theme='light'] {
  --bg: #f7f8fc;
  --bg-2: #eef0f8;
  --card: #ffffff;
  --card-2: #f1f3fa;
  --line: rgba(18, 20, 42, 0.1);
  --text: #111222;
  --muted: #52556e;
  --accent: #5248db;
  --accent-2: #4438ca;
  --accent-soft: rgba(82, 72, 219, 0.11);
}
:root[data-theme='light'] .nav--scrolled,
:root[data-theme='light'] .nav--open {
  background: rgba(247, 248, 252, 0.88);
}
:root[data-theme='light'] .hero {
  background:
    radial-gradient(60% 55% at 78% 30%, rgba(82, 72, 219, 0.14), transparent 70%),
    radial-gradient(45% 45% at 15% 85%, rgba(140, 90, 60, 0.08), transparent 70%),
    linear-gradient(180deg, #f9faff 0%, #f1f3fb 100%);
}
:root[data-theme='light'] .why {
  background: linear-gradient(180deg, #f7f8fc, #eef0f9 60%, #f7f8fc);
}
:root[data-theme='light'] .stat strong {
  background: linear-gradient(180deg, #111222, #5248db);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
:root[data-theme='light'] .hero__badge {
  background: rgba(255, 255, 255, 0.92);
  color: #111222;
}
:root[data-theme='light'] .marquee__row li {
  color: rgba(17, 18, 34, 0.65);
}
:root[data-theme='light'] .why__num {
  -webkit-text-stroke: 1px rgba(17, 18, 34, 0.22);
}
:root[data-theme='light'] .project__points li {
  color: #2c2f48;
}
:root[data-theme='light'] .contact-item {
  background: rgba(255, 255, 255, 0.85);
}
:root[data-theme='light'] .lang-switch,
:root[data-theme='light'] .theme-switch {
  color: #111222;
  background: rgba(17, 18, 34, 0.05);
}

/* ---------- Theme Switcher & Nav Enhancements ---------- */
.theme-switch {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  transition: border-color 0.25s, background 0.25s, transform 0.25s;
}
.theme-switch:hover {
  border-color: var(--accent-2);
  background: var(--accent-soft);
  transform: translateY(-1px);
}
.nav__links {
  gap: 20px;
}

/* ---------- Hero Extras ---------- */
.hero__badges-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 24px;
}
.hero__badges-row .eyebrow {
  margin-bottom: 0;
}
.eyebrow--loc svg {
  color: var(--accent-2);
}
.hero__badge--top {
  bottom: auto;
  right: auto;
  top: 4%;
  left: -2%;
}

/* ---------- Section Eyebrow ---------- */
.section__eyebrow {
  display: inline-block;
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-2);
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--accent-soft);
  margin-bottom: 12px;
}

/* ---------- Architecture Section ---------- */
.arch__grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin-top: 38px;
}
.arch__card {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.arch__top {
  display: flex;
  align-items: center;
  gap: 12px;
}
.arch__icon {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  font-size: 1.2rem;
  background: var(--accent-soft);
  color: var(--accent-2);
}
.arch__step {
  margin-inline-start: auto;
  font-family: var(--font-head);
  font-size: 1.8rem;
  font-weight: 700;
  opacity: 0.25;
}
.arch__card h3 {
  font-size: 1.25rem;
}
.arch__card p {
  color: var(--muted);
  font-size: 0.9rem;
}
.arch__chips {
  margin-top: auto;
  padding-top: 8px;
}

/* ---------- Experience & Credentials Section ---------- */
.exp__layout {
  display: grid;
  grid-template-columns: 1.25fr 0.75fr;
  gap: 28px;
  margin-top: 38px;
  align-items: start;
}
.exp__heading {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.25rem;
  margin-bottom: 18px;
  color: var(--accent-2);
}
.timeline,
.creds {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.timeline__item {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.timeline__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.timeline__period {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--muted);
}
.timeline__item h4,
.cred__edu h4,
.cred__cert h4 {
  font-size: 1.18rem;
  font-family: var(--font-head);
}
.timeline__org {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--accent-2);
}
.timeline__summary,
.cred__desc {
  font-size: 0.88rem;
  color: var(--muted);
}
.timeline__bullets {
  display: grid;
  gap: 8px;
  margin: 6px 0;
}
.timeline__bullets li {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 0.86rem;
  color: var(--text);
}
.timeline__bullets svg {
  flex: none;
  margin-top: 4px;
  color: var(--accent-2);
}
.timeline__tags {
  margin-top: 6px;
  margin-bottom: 0;
}
.cred__cert-head {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 10px;
}
.cred__badge-icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  font-size: 1.3rem;
  background: linear-gradient(135deg, #6a61f0, #4a41c8);
  color: #fff;
}

/* ---------- Skills Categories Matrix ---------- */
.skills__categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin-bottom: 18px;
}
.skills__cat-card .card__title {
  justify-content: space-between;
}

/* ---------- Project Filters & Actions ---------- */
.project-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 28px;
}
.filter-btn {
  padding: 9px 18px;
  font-size: 0.85rem;
  font-weight: 600;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  transition: all 0.25s;
}
.filter-btn:hover,
.filter-btn.is-active {
  background: var(--accent);
  border-color: var(--accent-2);
  color: #fff;
}
.project__arch {
  font-size: 0.78rem !important;
  font-weight: 600;
  color: var(--accent-2) !important;
  margin-bottom: 8px !important;
}
.project__points--compact {
  margin-bottom: 14px;
}
.project__actions--dual {
  flex-wrap: wrap;
  gap: 10px;
}
.project__actions--dual .project__btn {
  min-width: 165px;
  flex: 1;
  padding: 11px 18px;
  font-size: 0.84rem;
}

/* ---------- Case Study Modal & CV Modal ---------- */
.case-modal,
.cv-modal {
  position: relative;
  width: min(860px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  border-radius: 24px;
  background: var(--card);
  border: 1px solid rgba(123, 115, 255, 0.35);
  box-shadow: 0 40px 90px -20px rgba(0, 0, 0, 0.85);
  color: var(--text);
}
.case-modal__close,
.cv-modal__close {
  position: static;
  width: 40px;
  height: 40px;
}
.case-modal__media {
  position: relative;
  aspect-ratio: 16 / 8;
  background: #0d0d16;
  overflow: hidden;
}
.case-modal__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.case-modal__body {
  padding: 28px 32px 32px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.case-modal__CloseWrap {
  display: flex;
  justify-content: flex-end;
}
.case-modal > .case-modal__close {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 2;
}
.case-modal__arch {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.86rem;
  font-weight: 600;
  color: var(--accent-2);
}
.case-modal__desc {
  color: var(--muted);
  font-size: 0.94rem;
}
.case-modal__body h4 {
  margin-top: 8px;
  font-size: 1rem;
  color: var(--accent-2);
}
.case-modal__footer {
  margin-top: 12px;
}

.cv-modal {
  padding: 28px 32px;
}
.cv-modal__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 22px;
}
.cv-modal__header p {
  font-size: 0.84rem;
  color: var(--muted);
}
.cv-modal__actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.cv-modal__sheet {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.cv-sheet__top {
  text-align: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 16px;
}
.cv-sheet__role {
  color: var(--accent-2);
  font-weight: 600;
  margin-top: 4px;
}
.cv-sheet__contacts {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  margin-top: 10px;
  font-size: 0.84rem;
  color: var(--muted);
}
.cv-sheet__contacts span,
.cv-sheet__contacts a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.cv-sheet__section h4 {
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent-2);
  border-bottom: 1px solid var(--line);
  padding-bottom: 6px;
  margin-bottom: 10px;
}
.cv-sheet__section p,
.cv-sheet__section li {
  font-size: 0.88rem;
  color: var(--muted);
}
.cv-sheet__section ul {
  list-style: disc;
  padding-inline-start: 20px;
  display: grid;
  gap: 5px;
  margin-top: 6px;
}
.cv-sheet__entry {
  margin-bottom: 14px;
}
.cv-sheet__row {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--text);
  font-size: 0.92rem;
}

/* ---------- Contact Enhancements & Quick Form ---------- */
.cta {
  align-items: start;
}
.cta__btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 24px;
}
.contact-item-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.contact-item-wrap .contact-item {
  flex: 1;
}
.contact-copy {
  display: grid;
  place-items: center;
  width: 46px;
  height: 50px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(11, 11, 18, 0.55);
  color: var(--accent-2);
  transition: all 0.2s;
}
.contact-copy:hover {
  background: var(--accent);
  color: #fff;
}
.cta__form {
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: rgba(11, 11, 18, 0.6);
}
:root[data-theme='light'] .cta__form {
  background: rgba(255, 255, 255, 0.92);
}
.cta__form h3 {
  font-size: 1.25rem;
  margin-bottom: 4px;
}
.form-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--muted);
}
.form-field input,
.form-field select,
.form-field textarea {
  width: 100%;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card-2);
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
}
.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus {
  outline: 2px solid var(--accent-2);
  border-color: transparent;
}
.form-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 4px;
}
.form-note {
  font-size: 0.76rem;
  color: var(--muted);
}

@media (max-width: 960px) {
  .arch__grid,
  .exp__layout,
  .skills__categories {
    grid-template-columns: 1fr;
  }
}

/* =====================================================================
   Motion layer — loaded after index.css so it can extend/override it.
   ===================================================================== */

/* Cards & projects keep the reveal transitions and add their own. */
.card,
.project {
  transition: var(--reveal-t), border-color 0.25s, box-shadow 0.25s;
}

/* ---------- Keyframes ---------- */
@keyframes bob {
  50% {
    transform: translateY(-7px);
  }
}
@keyframes kenburns {
  from {
    transform: scale(1) translate(0, 0);
  }
  to {
    transform: scale(1.1) translate(-1.5%, -1%);
  }
}
@keyframes slide-up {
  from {
    transform: translateY(110%);
  }
  to {
    transform: none;
  }
}
@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.6) translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes slide-in-left {
  from {
    opacity: 0;
    translate: calc(var(--dir) * -26px) 0;
  }
}
@keyframes slide-in-right {
  from {
    opacity: 0;
    translate: calc(var(--dir) * 40px) 0;
  }
}
@keyframes ping {
  0% {
    transform: scale(1);
    opacity: 0.7;
  }
  100% {
    transform: scale(1.9);
    opacity: 0;
  }
}
@keyframes drift-a {
  50% {
    transform: translate(-60px, 50px) scale(1.15);
  }
}
@keyframes drift-b {
  50% {
    transform: translate(70px, -40px) scale(0.9);
  }
}
@keyframes sway-a {
  50% {
    transform: rotate(-5deg) scale(1.02);
  }
}
@keyframes sway-b {
  50% {
    transform: rotate(13deg) scale(0.98);
  }
}
@keyframes wiggle {
  0%,
  100% {
    transform: translateX(0) rotate(0);
  }
  25% {
    transform: translateX(-5px) rotate(-6deg);
  }
  75% {
    transform: translateX(5px) rotate(6deg);
  }
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes pulse-ring {
  0% {
    transform: scale(0.8);
    opacity: 0.9;
  }
  100% {
    transform: scale(2);
    opacity: 0;
  }
}
@keyframes dot-pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.55);
  }
  100% {
    box-shadow: 0 0 0 10px rgba(74, 222, 128, 0);
  }
}
@keyframes dot-pulse-accent {
  0% {
    box-shadow: 0 0 0 0 rgba(123, 115, 255, 0.6);
  }
  100% {
    box-shadow: 0 0 0 10px rgba(123, 115, 255, 0);
  }
}
@keyframes shimmer {
  0%,
  55% {
    left: -70%;
  }
  100% {
    left: 130%;
  }
}
@keyframes marquee {
  to {
    transform: translateX(-50%);
  }
}
@keyframes blink {
  50% {
    opacity: 0;
  }
}
@keyframes nav-in {
  from {
    opacity: 0;
    translate: 0 -100%;
  }
}
@keyframes nudge {
  50% {
    transform: translateY(-4px);
  }
}
@keyframes glow-breathe {
  50% {
    opacity: 0.55;
    transform: scale(1.12);
  }
}
@keyframes line-grow {
  from {
    width: 0;
  }
}

/* ---------- Navbar ---------- */
.nav {
  animation: nav-in 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.nav__progress {
  position: absolute;
  left: 0;
  bottom: -1px;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), #b9b4ff);
  transform: scaleX(0);
  transform-origin: left;
  box-shadow: 0 0 12px rgba(123, 115, 255, 0.8);
}
.logo__mark {
  transition: rotate 0.5s cubic-bezier(0.3, 1.6, 0.5, 1), scale 0.3s;
}
.logo:hover .logo__mark {
  rotate: 360deg;
  scale: 1.1;
}
@media (min-width: 821px) {
  .nav__links > a:not(.btn) {
    position: relative;
  }
  .nav__links > a:not(.btn)::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -6px;
    height: 2px;
    border-radius: 2px;
    background: var(--accent-2);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .nav__links > a:not(.btn):hover::after,
  .nav__links > a.is-active::after {
    transform: scaleX(1);
    transform-origin: left;
  }
}

/* ---------- Buttons ---------- */
.btn--primary {
  position: relative;
  overflow: hidden;
}
.btn--primary::before {
  content: '';
  position: absolute;
  top: 0;
  left: -70%;
  width: 45%;
  height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.4), transparent);
  transform: skewX(-20deg);
  animation: shimmer 3.4s ease-in-out infinite;
  pointer-events: none;
}
.btn svg {
  transition: translate 0.25s;
}
.btn:hover svg {
  translate: calc(var(--dir) * 2px) -2px;
}
/* Diagonal arrows point up-left in RTL. */
[dir='rtl'] .arrow-flip {
  transform: scaleX(-1);
}

/* ---------- Tilt cards ---------- */
.tilt {
  position: relative;
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
}
.tilt::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.35s;
  background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 50%), rgba(140, 132, 255, 0.2), transparent 62%);
}
.tilt:hover::after {
  opacity: 1;
}

/* ---------- Section titles ---------- */
.section__title {
  position: relative;
}
.section__title::after {
  content: '';
  display: block;
  width: 0;
  height: 4px;
  margin-top: 16px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), #b9b4ff);
}
.section__title.is-in::after,
.is-in .section__title::after {
  width: 64px;
  animation: line-grow 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.4s backwards;
}

/* ---------- Staggered children (driven by --i) ---------- */
.reveal:not(.is-in) .stagger {
  opacity: 0;
}
.reveal.is-in .stagger {
  animation: pop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.25) backwards;
  animation-delay: calc(var(--i, 0) * 90ms + 300ms);
}
.reveal.is-in .stagger--left {
  animation-name: slide-in-left;
}
.reveal.is-in .stagger--right {
  animation-name: slide-in-right;
}
.chips li {
  transition: translate 0.25s, background 0.25s, border-color 0.25s;
}
.chips li:hover {
  translate: 0 -3px;
  background: var(--accent-soft);
  border-color: var(--accent-2);
}
.list li {
  transition: padding-inline-start 0.25s, color 0.25s;
}
.list li:hover {
  padding-inline-start: 30px;
  color: var(--accent-2);
}
.interests b {
  transition: color 0.25s, translate 0.25s;
}
.interests b:hover {
  color: #fff;
  translate: 0 -2px;
}
.tags span {
  transition: background 0.25s, color 0.25s;
}
.project:hover .tags span {
  background: var(--accent);
  color: #fff;
}

/* ---------- Hero ---------- */
.hero__blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
}
.hero__blob--1 {
  top: -10%;
  right: 5%;
  width: 460px;
  height: 460px;
  background: rgba(91, 82, 224, 0.4);
  animation: drift-a 14s ease-in-out infinite;
}
.hero__blob--2 {
  bottom: -15%;
  left: -5%;
  width: 380px;
  height: 380px;
  background: rgba(150, 90, 60, 0.22);
  animation: drift-b 17s ease-in-out infinite;
}
.hero__grid {
  position: relative;
  z-index: 1;
}
.eyebrow--intro {
  animation: pop 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.05s backwards;
}
.eyebrow__dot {
  animation: dot-pulse 1.8s ease-out infinite;
}
.hero__title .line {
  display: block;
  overflow: hidden;
  padding: 6px 16px;
  margin: -6px -16px;
}
.hero__title .line__in {
  display: block;
  animation: slide-up 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}
.hero__title-box::before {
  animation: blink 2.4s ease-in-out infinite;
}
.hero__title-box::after {
  animation: blink 2.4s ease-in-out 1.2s infinite;
}
.hero__typed {
  font-family: var(--font-head);
  font-size: 1.25rem;
  font-weight: 500;
  margin-bottom: 16px;
  min-height: 1.6em;
}
.typed {
  color: var(--accent-2);
}
.caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-inline-start: 3px;
  vertical-align: -0.15em;
  background: var(--accent-2);
  animation: blink 0.9s steps(1) infinite;
}
.stat strong {
  display: block;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #fff, #b9b4ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* Parallax layers follow the pointer (--px / --py set on .hero). */
.hero__frame-outline,
.hero__frame-fill,
.hero__photo,
.deco,
.hero__badge {
  transition: translate 0.35s ease-out;
}
.hero__frame-outline {
  translate: calc(var(--px, 0) * -16px) calc(var(--py, 0) * -14px);
  animation: sway-a 7s ease-in-out infinite;
}
.hero__frame-fill {
  translate: calc(var(--px, 0) * 12px) calc(var(--py, 0) * 10px);
  animation: sway-b 8s ease-in-out infinite;
}
.hero__photo {
  translate: calc(var(--px, 0) * 22px) calc(var(--py, 0) * 18px);
}
.deco {
  translate: calc(var(--px, 0) * 34px) calc(var(--py, 0) * 28px);
}
.hero__badge {
  translate: calc(var(--px, 0) * 40px) calc(var(--py, 0) * 32px);
  animation: nudge 4s ease-in-out infinite;
}
.deco--squiggle {
  animation: wiggle 3s ease-in-out infinite;
}
.deco--plus {
  animation: spin 9s linear infinite;
}
.deco--play {
  animation: nudge 3.4s ease-in-out infinite;
}
.deco--circle::before {
  content: '';
  position: absolute;
  inset: -1.5px;
  border: 1.5px solid #fff;
  border-radius: 50%;
  animation: pulse-ring 2.4s ease-out infinite;
}
.hero__badge-dot {
  animation: dot-pulse-accent 2s ease-out infinite;
}

/* ---------- Marquee ---------- */
.marquee {
  position: relative;
  overflow: hidden;
  padding: 22px 0;
  border-block: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.02);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
}
.marquee__track {
  display: flex;
  width: max-content;
  animation: marquee 32s linear infinite;
}
.marquee:hover .marquee__track {
  animation-play-state: paused;
}
.marquee__row {
  display: flex;
  flex: none;
}
.marquee__row li {
  display: flex;
  align-items: center;
  gap: 28px;
  padding-right: 28px;
  font-family: var(--font-head);
  font-size: 1.35rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.55);
  white-space: nowrap;
  transition: color 0.25s;
}
.marquee__row li:hover {
  color: #fff;
}
.marquee__star {
  color: var(--accent-2);
  font-size: 0.9rem;
  animation: spin 6s linear infinite;
}

/* ---------- Why ---------- */
.why__icon {
  transition: rotate 0.6s cubic-bezier(0.3, 1.5, 0.5, 1), background 0.3s, color 0.3s, box-shadow 0.3s;
}
.why__item:hover .why__icon {
  rotate: -8deg;
  background: var(--accent);
  color: #fff;
  box-shadow: 0 12px 28px -8px rgba(91, 82, 224, 0.95);
}
.why__num {
  transition: -webkit-text-stroke-color 0.3s, translate 0.4s;
}
.why__item:hover .why__num {
  -webkit-text-stroke-color: var(--accent-2);
  translate: 0 -3px;
}
.why__item h3 {
  transition: color 0.25s;
}
.why__item:hover h3 {
  color: var(--accent-2);
}
/* soft glow that follows the hovered card's corner */
.why__item::before {
  content: '';
  position: absolute;
  right: -40px;
  bottom: -40px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: rgba(91, 82, 224, 0.28);
  filter: blur(40px);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}
.why__item:hover::before {
  opacity: 1;
}

/* ---------- Showcase (selected work) ---------- */
@keyframes bar-fill {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
@keyframes caption-in {
  from {
    opacity: 0;
    translate: 0 10px;
  }
}
.showcase {
  grid-row: span 2;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 18px;
  border-radius: 28px;
  border: 1px solid rgba(123, 115, 255, 0.28);
  background: radial-gradient(80% 60% at 0% 0%, rgba(91, 82, 224, 0.22), transparent 70%), var(--card);
}
.showcase__bars {
  display: flex;
  gap: 8px;
}
.showcase__bars button {
  flex: 1;
  height: 18px;
  padding: 7px 0;
  cursor: pointer;
}
.showcase__bars span {
  display: block;
  height: 3px;
  border-radius: 3px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.14);
}
.showcase__bars i {
  display: block;
  height: 100%;
  width: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent-2), #cfcbff);
  transform: scaleX(0);
  transform-origin: left;
}
.showcase__bars .is-done i {
  transform: scaleX(1);
}
.showcase__bars .is-active i {
  animation: bar-fill 4.5s linear forwards;
}
.showcase:hover .showcase__bars .is-active i,
.showcase:not(.is-in) .showcase__bars .is-active i {
  animation-play-state: paused;
}
.showcase__stage {
  position: relative;
  flex: 1;
  min-height: 240px;
  border-radius: 18px;
  overflow: hidden;
  background: #0d0d16;
}
.showcase__slide {
  position: absolute;
  inset: 0;
  margin: 0;
  opacity: 0;
  transition: opacity 0.8s ease;
}
.showcase__slide.is-active {
  opacity: 1;
}
.showcase__img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 40%;
  scale: 1.08;
  transition: scale 6s ease-out;
}
.showcase__slide.is-active .showcase__img {
  scale: 1;
}
.showcase__info {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 4px 6px 4px;
}
.showcase__label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent-2);
}
.showcase__info h3 {
  font-size: 1.45rem;
  animation: caption-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}
.showcase__info .tags {
  margin: 0;
  animation: caption-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.08s backwards;
}
.showcase__link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  width: fit-content;
  margin-top: 4px;
  font-size: 0.88rem;
  font-weight: 600;
  color: #fff;
  transition: gap 0.25s, color 0.25s;
}
.showcase__link:hover {
  gap: 10px;
  color: var(--accent-2);
}

/* ---------- Projects ---------- */
.project__media {
  position: relative;
}
.project__media::after {
  content: '';
  position: absolute;
  top: 0;
  left: -80%;
  width: 45%;
  height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22), transparent);
  transform: skewX(-20deg);
  pointer-events: none;
}
.project:hover .project__media::after {
  left: 140%;
  transition: left 0.9s ease;
}
.project__link svg {
  transition: translate 0.25s;
}
.project__link:hover svg {
  translate: 3px -3px;
}

/* ---------- Project buttons (centered, pill) ---------- */
.project__actions {
  display: flex;
  justify-content: center;
  margin-top: auto;
  padding-top: 22px;
}
.project__btn {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-width: 240px;
  padding: 13px 30px;
  border: 1.5px solid transparent;
  border-radius: 999px;
  overflow: hidden;
  font: 600 0.92rem/1 var(--font-body);
  letter-spacing: 0.01em;
  color: #fff;
  cursor: pointer;
  background: linear-gradient(var(--card), var(--card)) padding-box,
    linear-gradient(120deg, #6a61f0, #cfcbff 45%, #4a41c8) border-box;
  transition: transform 0.25s, box-shadow 0.25s;
}
.project__btn::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(120deg, #6a61f0, #4a41c8);
  transform: translateY(101%);
  transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.project__btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px -14px rgba(91, 82, 224, 0.95);
}
.project__btn:hover::before {
  transform: none;
}
.project__btn:active {
  transform: translateY(0) scale(0.98);
}
.project__btn-icon {
  font-size: 1.15rem;
}
.project__btn-arrow {
  transition: translate 0.25s;
}
.project__btn:hover .project__btn-arrow {
  translate: calc(var(--dir) * 3px) -3px;
}
.project__btn--solid {
  background: linear-gradient(120deg, #6a61f0, #4a41c8);
  box-shadow: 0 14px 34px -14px rgba(91, 82, 224, 0.9);
}
.project__btn--solid::before {
  background: rgba(255, 255, 255, 0.16);
}

/* ---------- Featured project (Masar) ---------- */
.project--featured {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  border-color: rgba(123, 115, 255, 0.3);
  background: radial-gradient(70% 90% at 100% 0%, rgba(91, 82, 224, 0.2), transparent 70%), var(--card);
}
.project__gallery {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  padding: 16px;
  background: linear-gradient(160deg, #1b1b2b, #101019);
}
.project__stage {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 16 / 10;
  border: 0;
  border-radius: 18px;
  overflow: hidden;
  background: #f6f7f9;
  cursor: zoom-in;
}
.project__stage img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  scale: 1.05;
  transition: opacity 0.5s ease, scale 0.9s ease;
}
.project__stage img.is-active {
  opacity: 1;
  scale: 1;
}
.project__stage:hover img.is-active {
  scale: 1.03;
}
.project__zoom {
  position: absolute;
  right: 12px;
  bottom: 12px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 13px;
  font-size: 0.74rem;
  font-weight: 600;
  color: #fff;
  background: rgba(11, 11, 18, 0.82);
  backdrop-filter: blur(8px);
  border-radius: 999px;
  opacity: 0;
  translate: 0 8px;
  transition: opacity 0.3s, translate 0.3s;
}
.project__stage:hover .project__zoom,
.project__stage:focus-visible .project__zoom {
  opacity: 1;
  translate: 0 0;
}
.project__thumbs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}
.project__thumbs button {
  aspect-ratio: 16 / 10;
  padding: 0;
  border: 2px solid transparent;
  border-radius: 12px;
  overflow: hidden;
  background: #f6f7f9;
  opacity: 0.55;
  cursor: pointer;
  transition: opacity 0.25s, border-color 0.25s, translate 0.25s;
}
.project__thumbs button:hover {
  opacity: 0.9;
  translate: 0 -3px;
}
.project__thumbs button.is-active {
  opacity: 1;
  border-color: var(--accent-2);
}
.project__thumbs img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.project--featured .project__body {
  justify-content: center;
  padding: 36px 36px 32px;
}
.project__ribbon {
  align-self: flex-start;
  margin-bottom: 16px;
  padding: 5px 13px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #fff;
  border-radius: 999px;
  background: linear-gradient(120deg, #6a61f0, #4a41c8);
  box-shadow: 0 8px 22px -8px rgba(91, 82, 224, 0.9);
}
.project--featured h3 {
  font-size: 1.9rem;
  margin-bottom: 4px;
}
.project__ar {
  font-family: 'Cairo', var(--font-body);
  font-size: 1.25rem !important;
  font-weight: 700;
  color: var(--accent-2) !important;
  text-align: left;
  margin-bottom: 14px !important;
}
.project__points {
  display: grid;
  gap: 9px;
  margin-bottom: 22px;
}
.project__points li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 0.85rem;
  color: #d4d4e4;
}
.project__points svg {
  flex: none;
  margin-top: 3px;
  padding: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  color: #fff;
  background: var(--accent);
}
.project--featured .project__actions {
  margin-top: 6px;
  padding-top: 8px;
}

/* ---------- Lightbox ---------- */
@keyframes lb-in {
  from {
    opacity: 0;
  }
}
@keyframes lb-zoom {
  from {
    opacity: 0;
    transform: scale(0.94) translateY(12px);
  }
}
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  padding: 60px 80px 70px;
  background: rgba(6, 6, 12, 0.9);
  backdrop-filter: blur(12px);
  animation: lb-in 0.3s ease;
}
.lightbox__figure {
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: min(1100px, 100%);
}
.lightbox__figure img {
  max-width: 100%;
  max-height: calc(100vh - 210px);
  object-fit: contain;
  margin-inline: auto;
  border-radius: 18px;
  background: #f6f7f9;
  box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.9);
  animation: lb-zoom 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.lightbox__figure figcaption {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-size: 0.85rem;
  color: var(--muted);
}
.lightbox__figure figcaption b {
  color: #fff;
  font-variant-numeric: tabular-nums;
}
.lightbox__close,
.lightbox__nav {
  position: absolute;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  color: #fff;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--line);
  transition: background 0.25s, scale 0.25s, rotate 0.35s;
}
.lightbox__close {
  top: 20px;
  right: 20px;
}
.lightbox__close:hover {
  background: var(--accent);
  rotate: 90deg;
}
.lightbox__nav {
  top: 50%;
  translate: 0 -50%;
}
.lightbox__nav--prev {
  left: 20px;
}
.lightbox__nav--next {
  right: 20px;
}
.lightbox__nav:hover {
  background: var(--accent);
  scale: 1.1;
}
.lightbox__dots {
  position: absolute;
  bottom: 24px;
  display: flex;
  gap: 8px;
}
.lightbox__dots button {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.3);
  transition: width 0.3s, background 0.3s;
}
.lightbox__dots button.is-active {
  width: 26px;
  background: var(--accent-2);
}

@media (max-width: 960px) {
  .project--featured {
    grid-template-columns: 1fr;
  }
  .project--featured .project__body {
    padding: 26px 22px 26px;
  }
}
@media (max-width: 640px) {
  .lightbox {
    padding: 64px 12px 70px;
  }
  .lightbox__nav {
    top: auto;
    bottom: 14px;
    translate: 0 0;
    width: 42px;
    height: 42px;
  }
  .lightbox__nav--prev {
    left: 16px;
  }
  .lightbox__nav--next {
    right: 16px;
  }
  .project__btn {
    width: 100%;
  }
  .project--featured h3 {
    font-size: 1.55rem;
  }
}

/* ---------- Contact ---------- */
.cta {
  position: relative;
  overflow: hidden;
}
.cta::before {
  content: '';
  position: absolute;
  top: -30%;
  right: -10%;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background: rgba(91, 82, 224, 0.35);
  filter: blur(80px);
  pointer-events: none;
  animation: glow-breathe 6s ease-in-out infinite;
}
.cta__text,
.cta__links {
  position: relative;
}
.contact-item span {
  transition: rotate 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), scale 0.3s;
}
.contact-item:hover span {
  rotate: -10deg;
  scale: 1.12;
}

/* ---------- Footer ---------- */
.to-top {
  display: inline-flex;
  gap: 6px;
}
.to-top span {
  display: inline-block;
  animation: nudge 1.8s ease-in-out infinite;
}

/* ---------- Language switch ---------- */
.nav__links {
  margin-inline-start: auto;
  margin-inline-end: 18px;
}
.nav__end {
  display: flex;
  align-items: center;
  gap: 10px;
}
.lang-switch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 15px;
  font-family: 'Cairo', var(--font-body);
  font-size: 0.86rem;
  font-weight: 600;
  line-height: 1.2;
  color: #fff;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.05);
  transition: border-color 0.25s, background 0.25s, transform 0.25s;
}
.lang-switch:hover {
  border-color: var(--accent-2);
  background: var(--accent-soft);
  transform: translateY(-1px);
}
.lang-switch svg {
  color: var(--accent-2);
  transition: rotate 0.6s cubic-bezier(0.3, 1.4, 0.5, 1);
}
.lang-switch:hover svg {
  rotate: 180deg;
}

/* ---------- Right-to-left (Arabic) ---------- */
/* Arabic letters must stay joined, and headings need more line-height. */
[dir='rtl'] * {
  letter-spacing: 0 !important;
}
[dir='rtl'] h1,
[dir='rtl'] h2,
[dir='rtl'] h3 {
  line-height: 1.3;
}
[dir='rtl'] .hero__title {
  line-height: 1.25;
}
[dir='rtl'] .project__ar {
  text-align: right;
}
[dir='rtl'] .nav__progress {
  left: auto;
  right: 0;
  transform-origin: right;
}
@media (min-width: 821px) {
  [dir='rtl'] .nav__links > a:not(.btn)::after {
    transform-origin: left;
  }
  [dir='rtl'] .nav__links > a:not(.btn):hover::after,
  [dir='rtl'] .nav__links > a.is-active::after {
    transform-origin: right;
  }
}
/* Numbers keep their own order (3.5+, not +3.5) inside RTL text. */
.count {
  display: inline-block;
  unicode-bidi: isolate;
}
/* Marquee scrolls in a fixed direction; keep its math left-to-right. */
.marquee {
  direction: ltr;
}
[dir='rtl'] .marquee__row li {
  font-family: 'Familjen Grotesk', 'Inter', sans-serif;
}

/* ---------- Small screens: no sideways entrances (avoids horizontal scroll) ---------- */
html,
body {
  overflow-x: clip;
}
@media (max-width: 820px) {
  .reveal--left,
  .reveal--right {
    translate: 0 32px;
  }
  .reveal.is-in.reveal--left,
  .reveal.is-in.reveal--right {
    translate: 0 0;
  }
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0ms !important;
  }
  .marquee__track {
    animation: none;
  }
}

      function showToast(msg) {
        const el = document.getElementById('toast');

        el.innerHTML = ICONS.check + ' <span>' + msg + '</span>';
        el.classList.add('is-shown');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('is-shown'), 2400);
      }

      function copyToClipboard(text, msg) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text);
            showToast(msg);
            return;
          }
        } catch (e) {}
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(msg);
      }

      function startTypewriter() {
        clearTimeout(twTimer);
        const t = I18N_CONTENT[STATE.lang];
        const words = t.hero.roles;
        const target = document.getElementById('tw-text');
        if (!target) return;
        let w = 0, i = 0, deleting = false;
        const step = () => {
          const word = words[w] || '';
          i += deleting ? -1 : 1;
          target.textContent = word.slice(0, i);
          let wait = deleting ? 35 : 70;
          if (!deleting && i === word.length) {
            deleting = true;
            wait = 1600;
          } else if (deleting && i === 0) {
            deleting = false;
            w = (w + 1) % words.length;
            wait = 320;
          }
          twTimer = setTimeout(step, wait);
        };
        twTimer = setTimeout(step, 350);
      }

      function initScrollAndReveal() {
        const bar = document.getElementById('nav-progress');
        const nav = document.getElementById('main-nav');
        const onScroll = () => {
          if (nav) nav.classList.toggle('nav--scrolled', window.scrollY > 24);
          const max = document.documentElement.scrollHeight - window.innerHeight;
          if (bar) bar.style.transform = `scaleX(${max > 0 ? window.scrollY / max : 0})`;
        };
        window.onscroll = onScroll;
        onScroll();

        if (typeof IntersectionObserver !== 'undefined') {
          const revealIo = new IntersectionObserver((entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add('is-in');
                revealIo.unobserve(e.target);
              }
            });
          }, { threshold: 0.1 });
          document.querySelectorAll('.reveal').forEach((el) => revealIo.observe(el));

          const countIo = new IntersectionObserver((entries) => {
            entries.forEach((e) => {
              if (!e.isIntersecting) return;
              countIo.unobserve(e.target);
              const to = parseFloat(e.target.dataset.to || '0');
              const dec = parseInt(e.target.dataset.dec || '0', 10);
              const suf = e.target.dataset.suf || '';
              const start = performance.now();
              const dur = 1600;
              const tick = (now) => {
                const p = Math.min((now - start) / dur, 1);
                const ease = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
                e.target.textContent = (to * ease).toFixed(dec) + suf;
                if (p < 1) requestAnimationFrame(tick);
              };
              requestAnimationFrame(tick);
            });
          }, { threshold: 0.5 });
          document.querySelectorAll('.count[data-to]').forEach((el) => countIo.observe(el));
        } else {
          document.querySelectorAll('.reveal').forEach((el) => el.classList.add('is-in'));
        }
      }

      function renderModals() {
        const t = I18N_CONTENT[STATE.lang];
        const pr = t.projects;
        const ex = t.experience;
        const sk = t.skills;

        if (STATE.lightbox) {
          const lb = STATE.lightbox;
          const cur = lb.images[lb.index];
          return `
            <div class="lightbox" dir="ltr" role="dialog" aria-modal="true" data-action="close-modal">
              <button type="button" class="lightbox__close" data-action="close-modal" aria-label="${t.lightbox.close}">

              </button>

              <button type="button" class="lightbox__nav lightbox__nav--next" data-action="lb-next" aria-label="${t.lightbox.next}">
                ${ICONS.chevRight}
              </button>
              <div class="lightbox__dots" data-stop="true">
                ${lb.images.map((im, i) => `
                  <button type="button" data-action="lb-dot" data-idx="${i}" class="${i === lb.index ? 'is-active' : ''}" aria-label="${t.lightbox.show} ${i + 1}"></button>
                `).join('')}
              </div>
            </div>
          `;
        }

        if (STATE.caseModalId) {
          const proj = PROJECTS.find((p) => p.id === STATE.caseModalId);
          const tx = pr.items[STATE.caseModalId];
          const cover = proj.cover || proj.image || proj.gallery[0];
          return `
            <div class="lightbox" role="dialog" aria-modal="true" data-action="close-modal">
              <div class="case-modal" data-stop="true">
                <button type="button" class="lightbox__close case-modal__close" data-action="close-modal" aria-label="${pr.modalClose}">
                  ${ICONS.close}
                </button>
                <div class="case-modal__media">
                  <img src="${cover}" alt="${tx.title}" />
                </div>
                <div class="case-modal__body">
                  <span class="pill">${tx.role || pr.ribbon}</span>
                  <h3>${tx.title}</h3>
                  ${tx.architecture ? `<p class="case-modal__arch">${ICONS.cpu} ${tx.architecture}</p>` : ''}
                  <p class="case-modal__desc">${tx.text}</p>
                  <h4>${pr.modalArch}</h4>
                  <ul class="project__points">
                    ${(tx.points || []).map((pt) => `<li>${ICONS.check} <span>${pt}</span></li>`).join('')}
                  </ul>
                  <h4>${pr.modalStack}</h4>
                  <div class="tags">
                    ${tx.tags.map((tg) => `<span>${tg}</span>`).join('')}
                  </div>
                  ${proj.repo ? `
                    <div class="case-modal__footer">
                      <a href="${proj.repo}" target="_blank" rel="noreferrer" class="btn btn--primary">
                        ${ICONS.github} ${pr.viewRepo} ${ICONS.arrowUpRight}
                      </a>
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        }

        if (STATE.cvModalOpen) {
          return `
            <div class="lightbox" role="dialog" aria-modal="true" data-action="close-modal">
              <div class="cv-modal" data-stop="true">
                <div class="cv-modal__header">
                  <div>
                    <h3>${t.cvModal.title}</h3>
                    <p>${t.cvModal.subtitle}</p>
                  </div>
                  <div class="cv-modal__actions">
                    <a href="${PROFILE.cv}" download="${PROFILE.cvName}" class="btn btn--primary">
                      ${ICONS.download} ${t.cvModal.download}
                    </a>
                    <button type="button" class="lightbox__close cv-modal__close" data-action="close-modal" aria-label="${t.cvModal.close}">
                      ${ICONS.close}
                    </button>
                  </div>
                </div>

                <div class="cv-modal__sheet">
                  <div class="cv-sheet__top">
                    <h2>${t.name}</h2>
                    <p class="cv-sheet__role">${t.role}</p>
                    <div class="cv-sheet__contacts" dir="ltr">
                      <span>${ICONS.phone} ${PROFILE.phone}</span>
                      <span>${ICONS.mail} ${PROFILE.email}</span>
                      <a href="${PROFILE.linkedin}" target="_blank" rel="noreferrer">${ICONS.linkedin} LinkedIn</a>
                      <a href="${PROFILE.github}" target="_blank" rel="noreferrer">${ICONS.github} GitHub</a>
                    </div>
                  </div>

                  <div class="cv-sheet__section">
                    <h4>${t.cvModal.summaryTitle}</h4>
                    <p>${t.hero.intro}</p>
                  </div>

                  <div class="cv-sheet__section">
                    <h4>${ex.workTitle}</h4>
                    ${ex.roles.map((r) => `
                      <div class="cv-sheet__entry">
                        <div class="cv-sheet__row">
                          <strong>${r.role} — ${r.org}</strong>
                          <span>${r.period}</span>
                        </div>
                        <ul>
                          ${r.bullets.map((b) => `<li>${b}</li>`).join('')}
                        </ul>
                      </div>
                    `).join('')}
                  </div>

                  <div class="cv-sheet__section">
                    <h4>${ex.eduCertTitle}</h4>
                    <div class="cv-sheet__row">
                      <strong>${ex.education.degree} — ${ex.education.school}</strong>
                      <span>${ex.education.period}</span>
                    </div>
                    <ul>
                      ${ex.certifications.map((c) => `<li><strong>${c.title}</strong> (${c.issuer}) — ${c.focus}</li>`).join('')}

                  <div class="cv-sheet__section">
                    <h4>${sk.title}</h4>
                    <div class="cv-sheet__skills">
                      ${sk.categories.map((cat) => `<p><strong>${cat.title}:</strong> ${cat.items.join(' · ')}</p>`).join('')}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        return '';
      }

      function captureFormValues() {
        const n = document.getElementById('f-name');
        const tp = document.getElementById('f-type');
        const m = document.getElementById('f-msg');
        if (n) STATE.formName = n.value;
        if (tp) STATE.formType = parseInt(tp.value || '0', 10);
        if (m) STATE.formMsg = m.value;
      }

      function buildFormattedInquiry() {
        captureFormValues();
        const c = I18N_CONTENT[STATE.lang].contact;
        const selectedType = c.types[STATE.formType] || c.types[0];
        const sender = STATE.formName.trim() || 'Client / Recruiter';
        const body = STATE.formMsg.trim() || 'I would love to discuss a mobile engineering project or opportunity.';
        return `Hello Adeeb,\n\nName: ${sender}\nInquiry: ${selectedType}\n\n${body}`;
      }

      // Global event delegation
      document.addEventListener('click', (e) => {
        const stopEl = e.target.closest('[data-stop="true"]');
        const actionEl = e.target.closest('[data-action]');
        if (!actionEl) {
          if (!stopEl && e.target.classList.contains('lightbox')) {
            STATE.lightbox = null;
            STATE.caseModalId = null;
            STATE.cvModalOpen = false;
            renderApp();
          }
          return;
        }
        const action = actionEl.dataset.action;
        const t = I18N_CONTENT[STATE.lang];

        if (action === 'toggle-lang') {
          captureFormValues();
          STATE.lang = STATE.lang === 'en' ? 'ar' : 'en';
          renderApp();
        } else if (action === 'toggle-theme') {
          captureFormValues();
          STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
          renderApp();
        } else if (action === 'toggle-menu') {
          STATE.navOpen = !STATE.navOpen;
          renderApp();
        } else if (action === 'close-nav' || action === 'nav-link') {
          if (actionEl.getAttribute('href')) STATE.activeNav = actionEl.getAttribute('href');
          STATE.navOpen = false;
          const nav = document.getElementById('main-nav');
          if (nav) nav.classList.remove('nav--open');
        } else if (action === 'showcase-slide') {
          captureFormValues();
          STATE.showcaseIdx = parseInt(actionEl.dataset.idx || '0', 10);
          renderApp();
        } else if (action === 'masar-thumb') {
          captureFormValues();
          STATE.masarIdx = parseInt(actionEl.dataset.idx || '0', 10);
          renderApp();
        } else if (action === 'filter-projects') {
          captureFormValues();
          STATE.projectFilter = actionEl.dataset.filter || 'all';
          renderApp();
        } else if (action === 'open-lightbox') {
          captureFormValues();
          const pid = actionEl.dataset.id || 'masar';
          const idx = parseInt(actionEl.dataset.idx || '0', 10);
          const proj = PROJECTS.find((p) => p.id === pid);
          const tx = t.projects.items[pid];
          STATE.lightbox = {
            title: tx.title,
            index: idx,
            images: proj.gallery.map((src, i) => ({ src, alt: tx.alts[i] })),
          };
          renderApp();
        } else if (action === 'lb-prev' && STATE.lightbox) {
          e.stopPropagation();
          const len = STATE.lightbox.images.length;
          STATE.lightbox.index = (STATE.lightbox.index - 1 + len) % len;
          renderApp();
        } else if (action === 'lb-next' && STATE.lightbox) {
          e.stopPropagation();
          const len = STATE.lightbox.images.length;
          STATE.lightbox.index = (STATE.lightbox.index + 1) % len;
          renderApp();
        } else if (action === 'lb-dot' && STATE.lightbox) {
          e.stopPropagation();
          STATE.lightbox.index = parseInt(actionEl.dataset.idx || '0', 10);
          renderApp();
        } else if (action === 'open-case') {
          captureFormValues();
          STATE.caseModalId = actionEl.dataset.id;
          renderApp();
        } else if (action === 'open-cv') {
          captureFormValues();
          STATE.navOpen = false;
          STATE.cvModalOpen = true;
          renderApp();
        } else if (action === 'close-modal') {
          if (stopEl && actionEl.classList.contains('lightbox')) return;
          STATE.lightbox = null;
          STATE.caseModalId = null;
          STATE.cvModalOpen = false;
          renderApp();
        } else if (action === 'copy-text') {
          copyToClipboard(actionEl.dataset.copy || '', t.contact.copied);
        } else if (action === 'send-whatsapp') {
          const msg = encodeURIComponent(buildFormattedInquiry());
          window.open(PROFILE.whatsapp + '?text=' + msg, '_blank', 'noopener,noreferrer');
        } else if (action === 'copy-brief') {
          copyToClipboard(buildFormattedInquiry(), t.contact.copied);
        }
      });

      document.addEventListener('submit', (e) => {
        if (e.target && e.target.id === 'inquiry-form') {
          e.preventDefault();
          const c = I18N_CONTENT[STATE.lang].contact;
          const text = buildFormattedInquiry();
          const subj = encodeURIComponent('[Portfolio] ' + (c.types[STATE.formType] || 'Mobile Inquiry'));
          const body = encodeURIComponent(text);
          window.open('mailto:' + PROFILE.email + '?subject=' + subj + '&body=' + body, '_self');
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && (STATE.lightbox || STATE.caseModalId || STATE.cvModalOpen)) {
          STATE.lightbox = null;
          STATE.caseModalId = null;
          STATE.cvModalOpen = false;
          renderApp();
        } else if (STATE.lightbox && e.key === 'ArrowRight') {
          const len = STATE.lightbox.images.length;
          STATE.lightbox.index = (STATE.lightbox.index + 1) % len;
          renderApp();
        } else if (STATE.lightbox && e.key === 'ArrowLeft') {
          const len = STATE.lightbox.images.length;
          STATE.lightbox.index = (STATE.lightbox.index - 1 + len) % len;
          renderApp();
        }
      });

      // Auto-advance showcase every 4.8s unless modal open
      setInterval(() => {
        if (STATE.lightbox || STATE.caseModalId || STATE.cvModalOpen) return;
        const barFill = document.querySelector('.showcase__bars .is-active');
        if (!barFill) return;
        STATE.showcaseIdx = (STATE.showcaseIdx + 1) % PROJECTS.length;
        const t = I18N_CONTENT[STATE.lang];
        const slides = PROJECTS.map((p) => ({
          id: p.id,
          title: t.projects.items[p.id].title,
          image: p.cover || p.image || p.gallery[0],
          tags: t.projects.items[p.id].tags.slice(0, 3),
        }));
        const active = slides[STATE.showcaseIdx];
        document.querySelectorAll('.showcase__bars button').forEach((b, i) => {
          b.className = i < STATE.showcaseIdx ? 'is-done' : i === STATE.showcaseIdx ? 'is-active' : '';
        });
        document.querySelectorAll('.showcase__slide').forEach((s, i) => {
          s.classList.toggle('is-active', i === STATE.showcaseIdx);
        });
        const titleEl = document.querySelector('.showcase__info h3');
        const tagsEl = document.querySelector('.showcase__info .tags');
        if (titleEl) titleEl.textContent = active.title;
        if (tagsEl) tagsEl.innerHTML = active.tags.map((tg) => `<span>${tg}</span>`).join('');
      }, 4800);

      window.addEventListener('DOMContentLoaded', renderApp);
    </script>
  </body>
</html>
